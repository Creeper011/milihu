[project]
name = "milihu"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11", "pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/milihu"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
extraPaths = ["src"]
reportImplicitOverride = "error"
reportInvalidCast = "error"
reportUnreachable = "error"
reportCallInDefaultInitializer = "error"
